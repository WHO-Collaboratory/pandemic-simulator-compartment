site_name: Pandemic Simulator - Compartment Models
site_description: API reference and guides for the WHO Pandemic Simulator compartmental modelling framework.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_if_no_docstring: false

hooks:
  - docs/generate_model_pages.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Developing Models: guides/developing-models.md
    - Adding Your Own Data: guides/adding-datasets.md
    - Interventions Guide: guides/interventions.md
    - Contact Matrices: guides/contact-matrices.md
    - Gravity Model: guides/gravity-model.md
    - Uncertainty Quantification: guides/uncertainty-quantification.md
  - API Reference:
    - Parameter Framework: api/parameters.md
    - Base Model: api/model.md
    - Interventions: api/interventions.md
  # Disease Models section is auto-generated by docs/generate_model_pages.py
