site_name: Pandemic Simulator - Compartment Models
site_description: API reference and guides for the WHO Pandemic Simulator compartmental modelling framework.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Developing Models: guides/developing-models.md
    - Interventions Guide: guides/interventions.md
    - Contact Matrices: guides/contact-matrices.md
    - Gravity Model: guides/gravity-model.md
    - Uncertainty Quantification: guides/uncertainty-quantification.md
  - API Reference:
    - Parameter Framework: api/parameters.md
    - Base Model: api/model.md
    - Interventions: api/interventions.md
  - Disease Models:
    - COVID SEIHDR: models/covid.md
    - COVID SEIHR: models/covid-seihr.md
    - COVID SEIDR: models/covid-seidr.md
    - COVID SEIR: models/covid-seir.md
    - COVID SIHDR: models/covid-sihdr.md
    - COVID SIHR: models/covid-sihr.md
    - COVID SIDR: models/covid-sidr.md
    - COVID SIR: models/covid-sir.md
    - Dengue (4-Serotype): models/dengue.md
    - Dengue (2-Strain): models/dengue-2strain.md
    - Ebola: models/ebola.md
    - Hantavirus (Rodent): models/hantavirus.md
    - Hantavirus (Human): models/hantavirus-human.md
    - Mpox: models/mpox.md
    - "Test: COVID SIR Stochastic": models/covid-sir-stochastic.md
    - "Test: Klebsiella AMR": models/klebsiella-amr.md
