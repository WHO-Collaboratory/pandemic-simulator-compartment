name: smoke-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      AWS_ROLE_NAME:
        required: true
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.find.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          models=$(ls -d compartment/models/*/example-config.json 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} | jq -R . | jq -sc .)
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "Discovered models: $models"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.discover.outputs.models) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        if: hashFiles(format('compartment/models/{0}/datasets.yaml', matrix.model)) != ''
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      # This is a no-op for models without datasets.yaml. For dataset-backed
      # models it downloads every declared version to its manifest file path.
      - name: Stage datasets for ${{ matrix.model }}
        if: hashFiles(format('compartment/models/{0}/datasets.yaml', matrix.model)) != ''
        run: |
          uv run python -m compartment.datasets stage \
            --model-dir compartment/models/${{ matrix.model }}

      - name: Smoke test ${{ matrix.model }}
        run: uv run python -m pytest tests/test_smoke.py -v -m integration -k "${{ matrix.model }}"

      - name: Disease and unit tests
        run: |
          TEST_FILE="tests/test_${{ matrix.model }}.py"
          if [ -f "$TEST_FILE" ]; then
            uv run python -m pytest "$TEST_FILE" -v
          fi

  # The whole unit suite, minus the per-model integration smoke tests the
  # `test` matrix above already covers. Runs in seconds, so it gates every
  # push and PR rather than only the files someone remembered to name.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Stage all declared datasets
        run: |
          find compartment/models -name datasets.yaml -print0 \
            | while IFS= read -r -d '' manifest; do
                uv run python -m compartment.datasets stage \
                  --model-dir "$(dirname "$manifest")"
              done

      - name: Unit tests
        run: uv run python -m pytest tests/ -m "not integration" -q

  artifact-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Artifact and registry tests
        run: uv run python -m pytest tests/test_artifact.py -v
